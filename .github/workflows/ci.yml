name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the normative files
        run: python cli/forge.py lint-rules AGENTS.md skills agents
      - name: Validate the repository
        run: python scripts/validate_repo.py
      - name: Run every suite
        run: |
          set -e
          for t in tests/*.sh; do
            echo "== $t"
            bash "$t"
          done
